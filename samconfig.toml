# AWS SAM CLI Configuration File
# This file configures the AWS SAM CLI for deployment

version = 1.0

[default]
[default.deploy]
[default.deploy.parameters]
stack_name = "guestbook-app"
resolve_s3 = true
s3_prefix = "guestbook-app"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=dev LogLevel=INFO AllowedOrigins=* RateLimit=100"

[default.build]
[default.build.parameters]
cached = true
parallel = true

[prod]
[prod.deploy]
[prod.deploy.parameters]
stack_name = "guestbook-app-prod"
parameter_overrides = "Environment=prod LogLevel=WARNING AllowedOrigins=https://yourdomain.com RateLimit=200"
