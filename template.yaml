AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Local Job Board - Supporting South African employment and economic growth.
  S3 static frontend, API Gateway HTTP API, Lambda functions, DynamoDB table.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.12
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !Ref JobsTable
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
    Tracing: Active
    LoggingConfig:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-functions"
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - !Ref AllowedOrigins
      AllowHeaders:
        - "Content-Type"
        - "X-Amz-Date"
        - "Authorization"
        - "X-Api-Key"
      AllowMethods:
        - "GET"
        - "POST"
        - "OPTIONS"
      MaxAge: 600

Parameters:
  Environment:
    Type: String
    Default: "dev"
    AllowedValues:
      - "dev"
      - "staging"
      - "prod"
    Description: Environment name for configuration

  LogLevel:
    Type: String
    Default: "INFO"
    AllowedValues:
      - "DEBUG"
      - "INFO"
      - "WARNING"
      - "ERROR"
    Description: Logging level for Lambda functions

  AllowedOrigins:
    Type: String
    Default: "*"
    Description: Allowed CORS origins (comma-separated, use * for all)

  RateLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000
    Description: API rate limit per minute

Resources:

  # DynamoDB Table for job postings
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: LocalJobBoard
        - Key: Environment
          Value: !Ref Environment

  # CloudWatch Alarms
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alert when Lambda functions have high error rate"
      AlarmName: !Sub "${AWS::StackName}-lambda-errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref PostJobFunction

  DynamoDBReadCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alert when DynamoDB read capacity is high"
      AlarmName: !Sub "${AWS::StackName}-dynamodb-reads"
      MetricName: ConsumedReadCapacityUnits
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref JobsTable

  # API Gateway Usage Plan (Rate Limiting)
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub "${AWS::StackName}-usage-plan"
      Description: "Rate limiting for job board API"
      Throttle:
        RateLimit: !Ref RateLimit
        BurstLimit: !Ref RateLimit
      ApiStages:
        - ApiId: !Ref ServerlessHttpApi
          Stage: !Ref HttpApiStage

  # Lambda Functions
  PostJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      Description: "Handle job posting submissions"
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref JobsTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        PostJob:
          Type: HttpApi
          Properties:
            Path: /jobs
            Method: post
            TimeoutInMillis: 5000
      Tags:
        Key: Function
        Value: PostJob

  ListJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.list_handler
      Description: "Retrieve job postings"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
        - CloudWatchPutMetricPolicy: {}
      Events:
        ListJobs:
          Type: HttpApi
          Properties:
            Path: /jobs
            Method: get
            TimeoutInMillis: 5000
      Tags:
        Key: Function
        Value: ListJobs

  # S3 Static Website
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "local-job-board-${Environment}-${AWS::AccountId}-${AWS::Region}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Project
          Value: LocalJobBoard
        - Key: Environment
          Value: !Ref Environment

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${WebsiteBucket.Arn}/*"

  # S3 Bucket for Lambda Logs
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "local-job-board-logs-${Environment}-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: LogRetention
            Status: Enabled
            ExpirationInDays: 30

Outputs:
  ApiUrl:
    Description: "API Gateway base URL (frontend calls /jobs)"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  WebsiteURL:
    Description: "S3 static website URL"
    Value: !GetAtt WebsiteBucket.WebsiteURL
  BucketName:
    Description: "S3 bucket name (used by deploy.sh to upload the frontend)"
    Value: !Ref WebsiteBucket
  TableName:
    Description: "DynamoDB table name"
    Value: !Ref JobsTable
  Environment:
    Description: "Current environment"
    Value: !Ref Environment
  LogBucketName:
    Description: "S3 bucket for centralized logging"
    Value: !Ref LogBucket
